  /api/v1/candidates/{candidate-id}/court-searches:
    get:
      summary: Fetch court search information about the given candidate
      operationId: candidateCourtSearchInfo
      parameters:
        - name: JWT
          in: cookie
          required: true
          schema:
            type: string
            example: "eyJhbGciOiJIUz..."
        - name: candidate-id
          in: path
          required: true
          schema:
            type: integer

      responses:
        "200":
          description: Fetched court search information about the given candidate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CandidateCourtSearchInfo'

        "401":
          description: Unauthorized

        "404":
          description: Candidate not found


  /api/v1/adverse-actions:
    get:
      summary: Fetch a paginated list of adverse actions with optional filtering on name and status
      operationId: adverse-actions
      parameters:
        - name: JWT
          in: cookie
          required: true
          schema:
            type: string
            example: "eyJhbGciOiJIUz..."
        - name: name
          in: query
          required: false
          schema:
            type: string
          description: Filter candidates by name

        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [PENDING,SCHEDULED, DISPUTE, CANCELLED, UNDELIVERABLE, COMPLETED]

        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: "Page number (default is 1)"

        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: "Number of records per page (default is 10)"

        - name: sort
          in: query
          required: false
          schema:
            type: string
            example: "name,asc"
          description: "Sort field and order (e.g., 'name,asc' or 'age,desc')"

      responses:
        "200":
          description: Fetched a paginated list of adverse actions with optional filtering on name and sta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAdverseActionsResponse'
        "400":
          description: No adverse-action found
        "401":
          description: Unauthorized



components:
  schemas:
    CandidateReportsExportRequest:
      type: object
      required: [from-date,to-date]
      properties:
        from-date:
          type: string
        to-date:
          type: string

    CandidateReportAdjudicationRequest:
      type: object
      required: [adjudicationStatus,notice-date]
      properties:
        adjudicationStatus:
          type: string
          enum: [ADVERSE ACTION, ENGAGE]
        notice-days:
          type: integer
          example: 5

    CandidateInfo:
      type: object
      required: [id,name,email,dob,phone,zipcode,location,social_security_number,drivers_license_number,created_at,adjudication,adjudication_created_at,adjudication_completed_at,adjudication_status,package,turn_around_time,court_searches]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        dob:
          type: string
        phone:
          type: string
        zipcode:
          type: integer
        social_security_number:
          type: string
        drivers_license_number:
          type: string
        created_at:
          type: string
        adjudication:
          type: string
        adjudication_created_at:
          type: string
        adjudication_completed_at:
          type: string
        adjudication_status:
          type: string
        package:
          type: string
        turn_around_time:
          type: string
        court_searches:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
                example: Country Criminal
              status:
                type: string
                enum: [CLEAR, CONSIDER]
              date:
                type: string
                example: "12/01/2022"


    CandidateGeneralInfo:
      type: object
      required: [name,email,dob,phone,zipcode,social_security_number,drivers_license_number,createdAt]
      properties:
        name:
          type: string
        email:
          type: string
        dob:
          type: string
        phone:
          type: string
        zipcode:
          type: integer
        social_security_number:
          type: string
        drivers_license_number:
          type: string
        createdAt:
          type: string


    CandidateReportInfo:
      type: object
      required: [status,adjudication,package,createdAt,completedAt,turnAroundTime]
      properties:
        status:
          type: string
          enum: [CLEAR, CONSIDER]
        adjudication:
          type: string
          enum: [ADVERSE ACTION, ENGAGE]
        package:
          type: string
        createdAt:
          type: string
        completedAt:
          type: string
        turnAroundTime:
          type: integer


    CandidateCourtSearchInfo:
      type: array
      items:
        type: object
        properties:
          name:
            type: string
            example: Country Criminal
          status:
            type: string
            enum: [CLEAR, CONSIDER]
          date:
            type: string
            example: "12/01/2022"

    PaginatedCandidateReportResponse:
      type: object
      required: [totalRecords,totalPages,currentPage,pageSize,candidateReports]
      properties:
        totalRecords:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
        currentPage:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        candidateReports:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: "John Doe"
              adjudication:
                type: string
                enum: [PRE-ADVERSE ACTION, ENGAGED]
              status:
                type: string
                enum: [CLEAR, CONSIDER]
              location:
                type: string
                example: "LONDON"
              date:
                type: string
                example: "12/01/2022"

    PaginatedAdverseActionsResponse:
      type: object
      required: [totalRecords,totalPages,currentPage,pageSize,adverseActions]
      properties:
        totalRecords:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
        currentPage:
          type: integer
          example: 1
        pageSize:
          type: integer
          example: 10
        adverseActions:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                example: 1
              name:
                type: string
                example: "John Doe"
              status:
                type: string
                enum: [CLEAR, CONSIDER]
              pre-notice-date:
                type: string
                example: "12/01/2022"
              post-notice-date:
                type: string
                example: "19/01/2022"

    SignUpRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    SignInRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password



    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password




